faq:
    title: "Frequently Asked Questions"
    text: "Home loans, pre-approval and bond origination explained"
    section: faq
    disclaimer: "This information is general guidance only. Approval, interest rates and lending decisions are subject to each bank's assessment and their specific criteria. For advice on your situation, please"
    disclaimer_link_text: "contact us"
    items:
      - question: "What does a bond originator do?"
        answer: "A bond originator submits your home-loan application to several banks on your behalf, compares the quotes they return, and helps you negotiate a competitive interest rate. A bond originator is not a lender; we act as your intermediary with the banks and guide you through the paperwork and the process from application to registration."
      - question: "How does home-loan pre-approval work?"
        answer: "Pre-approval is an assessment of your income, expenses and existing debt to indicate how much you may be able to borrow. It helps you shop for a home within a realistic price range. Pre-approval is an indication only; the final amount, rate and approval remain subject to the selected bank's full assessment and the signed purchase agreement."
      - question: "What documents do I need for a home loan?"
        answer: "Most banks ask for a copy of your ID, proof of income, three to six months of bank statements, proof of residence, and the signed offer to purchase once you have one. Having these ready helps avoid delays."
      - question: "How long does bond approval take?"
        answer: "Timelines vary by bank and by how complete your application is. A straightforward application with all documents submitted can often be assessed within a few working days, while more complex cases may take a few weeks."
      - question: "Can self-employed applicants qualify for a home loan?"
        answer: "Yes. Self-employed buyers can qualify, usually with additional documentation such as personal and business financial statements, SARS tax returns and bank statements. Lenders assess affordability in the same way, so clear, well-organised records make the process smoother."
      - question: "Can I refinance or switch my existing home loan?"
        answer: "Yes. If you already have a bond, it is often worth reviewing your rate. A bond originator can request quotes from other banks to see whether switching or refinancing could lower your monthly repayment. Any saving depends on current rates, your profile and the bank's assessment."
      - question: "Will an initial enquiry affect my credit score?"
        answer: "An initial, obligation-free conversation with us does not affect your credit score. A formal credit enquiry is only triggered when a lender runs a credit check as part of an actual application. We will always explain this before anything is submitted to a bank."
      - question: "Are there costs to use a bond originator?"
        answer: "For standard home loans, bond originator commission is generally paid by the lending bank rather than by you. It is always best to confirm the specific arrangement with us, and we are happy to explain it clearly before you proceed."

calculator_pages:
    cta_label: "Start Calculating"
    contact_label: "Contact Us"
    faq_intro: "A few quick answers before you take the next step."
    bond:
      hero_eyebrow: "Home Loan Calculator"
      hero_title: "Bond Repayment Calculator"
      hero_text: "Estimate your monthly bond repayments and get a clearer view of what your home loan could cost before you apply."
      anchor: "bond-calculator"
      iframe_title: "Bond Calculator"
      faq_title: "Bond Calculator FAQs"
      faqs:
        - question: "What does a bond repayment calculator show?"
          answer: "It estimates your monthly repayment based on the loan amount, interest rate, and repayment term."
        - question: "Is this the final amount the bank will offer?"
          answer: "No. It is a guide. The bank will still assess your income, expenses, credit profile, and the property details."
        - question: "Can oobalink help me compare bank offers?"
          answer: "Yes. We submit your application to multiple banks and help you compare the available offers."
        - question: "What should I do after calculating my repayment?"
          answer: "Speak to us about prequalification so you know what you can shop for with more confidence."
    transfer:
      hero_eyebrow: "Property Purchase Calculator"
      hero_title: "Transfer Cost Calculator"
      hero_text: "Estimate the bond and transfer costs involved in buying a home with the oobalink Northern Suburbs transfer cost calculator."
      anchor: "transfer-calculator"
      iframe_title: "Transfer Cost Calculator"
      faq_title: "Transfer Cost Calculator FAQs"
      faqs:
        - question: "What does a transfer cost calculator show?"
          answer: "It estimates the costs involved in transferring property ownership, including transfer duty, conveyancing fees, and other related expenses."
        - question: "Are transfer costs the same for every property?"
          answer: "No. Transfer costs vary based on the property value, the type of property, and the specific requirements of the transaction."
        - question: "Can oobalink help me understand these costs?"
          answer: "Yes. We walk you through the transfer cost breakdown and connect you with trusted conveyancers to keep your purchase on track."
        - question: "When do I pay transfer costs?"
          answer: "Transfer costs are typically paid before the property is transferred into your name, usually within a few days of registration."

