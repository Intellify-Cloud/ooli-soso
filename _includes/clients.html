<!-- Clients -->
<section class="clients page-section" id="{{ site.data.sitetext.clients.section | default: "clients" }}">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading text-uppercase">{{ site.data.sitetext.clients.title }}</h2>
        {% if site.data.sitetext.clients.text %}
          <h3 class="section-subheading text-muted">{{ site.data.sitetext.clients.text }}</h3>
        {% endif %}
      </div>
    </div>

    <div class="clients__grid{% if site.data.sitetext.clients.horizontal-scrolling == "yes" %} clients__scroll{% endif %}">
      {% for client in site.data.sitetext.clients.list %}
      <div class="clients__item">
        <a class="clients__link" href="{{ client.url }}" {% if client.url != "#" %}target="_blank" rel="noopener"{% endif %} aria-label="{{ client.title }}">
          <img class="clients__logo" src="{{ client.logo | relative_url }}" alt="{{ client.title }}">
        </a>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
