{% assign org_name = site.business_name | default: site.title %}
{% assign org_url = site.url %}
{% assign canonical_path = page.canonical_url | default: page.url | replace: 'index.html', '' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": ["FinancialService", "LocalBusiness"],
      "name": {{ org_name | jsonify }},
      "url": {{ org_url | jsonify }},
      "logo": {{ site.logo.path | absolute_url | jsonify }},
      "image": {{ '/social.jpg' | absolute_url | jsonify }},
      "description": {{ site.description | jsonify }},
      "email": {{ site.email | jsonify }},
      "telephone": {{ site.telephone | jsonify }},
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "48 Drakenstein Road, Durbanville Hills",
        "addressLocality": "Cape Town",
        "addressRegion": "Western Cape",
        "postalCode": "7550",
        "addressCountry": "ZA"
      },
      "areaServed": {{ site.service_area | jsonify }},
      "priceRange": "Free to customer",
      "parentOrganization": {
        "@type": "Organization",
        "name": "oobalink"
      },
      "sameAs": [
        {{ site.url | jsonify }}{% for social in site.social %}{% if social[1] and social[1] != "" %},
        {{ social[1] | jsonify }}{% endif %}{% endfor %}
      ]
    },
    {
      "@type": "WebSite",
      "url": {{ org_url | jsonify }},
      "name": {{ org_name | jsonify }},
      "publisher": {
        "@type": "Organization",
        "name": {{ org_name | jsonify }}
      },
      "inLanguage": "en-ZA"
    },
    {
      "@type": "WebPage",
      "name": {{ page.title | default: site.title | jsonify }},
      "description": {{ page.description | default: site.description | jsonify }},
      "url": {{ canonical_path | absolute_url | jsonify }},
      "inLanguage": "en-ZA",
      "publisher": {
        "@type": "Organization",
        "name": {{ org_name | jsonify }}
      }
    },
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": {{ '/' | absolute_url | jsonify }}
        }
        {% if page.breadcrumb_parent %}
        ,{
          "@type": "ListItem",
          "position": 2,
          "name": {{ page.breadcrumb_parent_label | default: 'Services' | jsonify }},
          "item": {{ page.breadcrumb_parent | absolute_url | jsonify }}
        }
        ,{
          "@type": "ListItem",
          "position": 3,
          "name": {{ page.title | default: 'Page' | jsonify }},
          "item": {{ canonical_path | absolute_url | jsonify }}
        }
        {% else %}
        ,{
          "@type": "ListItem",
          "position": 2,
          "name": {{ page.title | default: 'Page' | jsonify }},
          "item": {{ canonical_path | absolute_url | jsonify }}
        }
        {% endif %}
      ]
    }
  ]
}
</script>
